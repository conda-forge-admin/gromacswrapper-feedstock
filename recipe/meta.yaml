{% set name = "gromacswrapper" %}
{% set version = "0.9.3" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: df0678475ecd0fd133ec34c2fbcaf6a6f46d0b574b3b6f1b5b19b920669ec029

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - matplotlib-base
    - numkit
    - numpy >=1.0
    - python >={{ python_min }}

test:
  imports:
    - gromacs
    - gromacs.fileformats
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/Becksteinlab/GromacsWrapper
  summary: A Python wrapper around the Gromacs tools.
  doc_url: https://gromacswrapper.readthedocs.io/
  dev_url: https://github.com/Becksteinlab/GromacsWrapper
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: COPYING
  description: |
    GromacsWrapper is a Python package that wraps system calls to GROMACS
    tools into thin classes. This allows for fairly seamless integration
    of the GROMACS tools into Python scripts.

extra:
  recipe-maintainers:
    - orbeckst
    - njzjz
